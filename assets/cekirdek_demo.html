svg[data-state="listening"] .eye{transform:scale(1.15);animation:none}
svg[data-state="thinking"] .ring{animation-duration:2.5s;opacity:1}
svg[data-state="thinking"] .eye{animation:none;transform:scaleY(.5)}
svg[data-state="thinking"] .mouth{opacity:0}
svg[data-state="thinking"] .dots{opacity:1}
svg[data-state="thinking"] .dots circle{animation:dot 1.2s infinite}
svg[data-state="thinking"] .dots circle:nth-child(2){animation-delay:.2s}
svg[data-state="thinking"] .dots circle:nth-child(3){animation-delay:.4s}
svg[data-state="speaking"] .mouth{stroke-width:7;transform-origin:0 28px;animation:talk .35s ease-in-out infinite}
svg[data-state="speaking"] .halo{animation-duration:1.2s}
svg[data-state="alert"] .halo{animation:flash 1s infinite}
svg[data-state="alert"] .ring{animation-duration:6s}
svg[data-state="error"] #m{animation:shake .4s 2}
svg[data-state="error"] .ring{animation:none;stroke-dasharray:2 14}
svg[data-state="error"] .mouth{d:path("M-14 34 Q0 22 14 34")}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
